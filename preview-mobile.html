<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>모바일 미리보기</title>
<style>
html,body{margin:0;background:#DCD7D2;font:12px/1.4 system-ui}
.grid{display:grid;grid-template-columns:repeat(3,390px);gap:14px;justify-content:center;padding:14px}
.cell{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.lbl{height:22px;line-height:22px;text-align:center;font-weight:700;color:#444;background:#EFEBE7}
iframe{display:block;width:390px;height:820px;border:0;background:#fff}
</style>
</head>
<body>
<div class="grid">
  <div class="cell"><div class="lbl">hero</div><iframe src="preview.html#top"></iframe></div>
  <div class="cell"><div class="lbl">operator</div><iframe src="preview.html#about"></iframe></div>
  <div class="cell"><div class="lbl">problem</div><iframe src="preview.html#problem"></iframe></div>
  <div class="cell"><div class="lbl">curriculum</div><iframe src="preview.html#curriculum"></iframe></div>
  <div class="cell"><div class="lbl">dashboard</div><iframe src="preview.html#record"></iframe></div>
  <div class="cell"><div class="lbl">proof</div><iframe src="preview.html#proof"></iframe></div>
  <div class="cell"><div class="lbl">reviews</div><iframe src="preview.html#reviews"></iframe></div>
  <div class="cell"><div class="lbl">offer</div><iframe src="preview.html#offer"></iframe></div>
  <div class="cell"><div class="lbl">faq</div><iframe src="preview.html#faq"></iframe></div>
</div>
</body>
</html>
